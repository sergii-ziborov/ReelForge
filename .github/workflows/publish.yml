# Publish workspace crates to crates.io (ordered by dependency graph).
# Run CI first: this job re-checks fmt/clippy/test before upload.
name: publish-crates

on:
  workflow_dispatch:

jobs:
  preflight:
    name: quality preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          components: rustfmt, clippy

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace --all-targets

      - name: package list (manifest packaging check)
        shell: bash
        run: |
          set -euo pipefail
          # Full package dry-run cannot resolve unpublished path-dep versions
          # (e.g. reelforge-io ^0.2.0 before core is uploaded). --list validates
          # include/exclude without hitting crates.io for workspace siblings.
          for pkg in reelforge-core reelforge-compose reelforge-fx reelforge-text reelforge-render-graph reelforge-sightloom-adapter reelforge-project reelforge-io reelforge reelforge-cli; do
            echo "==== ${pkg} ===="
            cargo package -p "${pkg}" --list --allow-dirty >/dev/null
          done

  publish:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          CARGO_HTTP_USER_AGENT: "reelforge-publish (github.com/sergii-ziborov/ReelForge)"
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CARGO_REGISTRY_TOKEN:-}" ]]; then
            echo "CARGO_REGISTRY_TOKEN secret is missing"
            exit 1
          fi

          # crates.io rejects clients without a descriptive User-Agent.
          export CARGO_REGISTRIES_CRATES_IO_PROTOCOL=sparse

          WS_VERSION="$(python3 - <<'PY'
import pathlib, re
text = pathlib.Path("Cargo.toml").read_text(encoding="utf-8")
m = re.search(r"\[workspace\.package\][^\[]*version\s*=\s*\"([^\"]+)\"", text, re.S)
if not m:
    raise SystemExit("workspace.package.version not found")
print(m.group(1))
PY
)"
          echo "Publishing workspace version ${WS_VERSION}"

          CRATES=(
            reelforge-core
            reelforge-compose
            reelforge-fx
            reelforge-text
            reelforge-render-graph
            reelforge-sightloom-adapter
            reelforge-project
            reelforge-io
            reelforge
            reelforge-cli
          )

          crate_exists() {
            local name="$1"
            local ver="$2"
            curl -fsS -A "reelforge-publish" \
              "https://crates.io/api/v1/crates/${name}/${ver}" >/dev/null 2>&1
          }

          publish_one() {
            local pkg="$1"
            echo "==== Publishing ${pkg} ${WS_VERSION} ===="
            if crate_exists "${pkg}" "${WS_VERSION}"; then
              echo "${pkg} ${WS_VERSION} already on crates.io; skip"
              return 0
            fi
            # cargo publish waits until the crate is available after upload.
            # Retry on crates.io new-crate rate limits (HTTP 429).
            local attempt
            for attempt in 1 2 3 4 5; do
              if cargo publish -p "${pkg}" --locked; then
                break
              fi
              echo "publish ${pkg} attempt ${attempt} failed; sleeping 180s (rate limit / index)..."
              sleep 180
              if crate_exists "${pkg}" "${WS_VERSION}"; then
                echo "${pkg} appeared on crates.io after retry wait"
                break
              fi
              if [[ "${attempt}" -eq 5 ]]; then
                return 1
              fi
            done
            # Extra settle for sparse index + rate limit budget.
            sleep 90
          }

          for pkg in "${CRATES[@]}"; do
            publish_one "${pkg}"
          done

          echo "All crates published."
          for c in "${CRATES[@]}"; do
            if crate_exists "$c" "${WS_VERSION}"; then
              echo "OK $c ${WS_VERSION}"
            else
              echo "MISSING $c ${WS_VERSION}"
              exit 1
            fi
          done
