# Publish workspace crates to crates.io (ordered by dependency graph).
name: publish-crates

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          CARGO_HTTP_USER_AGENT: "reelforge-publish (github.com/sergii-ziborov/ReelForge)"
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CARGO_REGISTRY_TOKEN:-}" ]]; then
            echo "CARGO_REGISTRY_TOKEN secret is missing"
            exit 1
          fi

          # crates.io rejects clients without a descriptive User-Agent.
          export CARGO_REGISTRIES_CRATES_IO_PROTOCOL=sparse

          crate_exists() {
            local name="$1"
            local ver="$2"
            curl -fsS -A "reelforge-publish" \
              "https://crates.io/api/v1/crates/${name}/${ver}" >/dev/null 2>&1
          }

          publish_one() {
            local pkg="$1"
            echo "==== Publishing ${pkg} ===="
            if crate_exists "${pkg}" "0.1.0"; then
              echo "${pkg} 0.1.0 already on crates.io; skip"
              return 0
            fi
            # cargo publish waits until the crate is available after upload.
            cargo publish -p "${pkg}" --locked
            # Extra settle time for dependents' index resolution.
            sleep 25
          }

          publish_one reelforge-core
          publish_one reelforge-compose
          publish_one reelforge-fx
          publish_one reelforge-io
          publish_one reelforge-text
          publish_one reelforge
          publish_one reelforge-cli

          echo "All crates published."
          for c in reelforge-core reelforge-compose reelforge-fx reelforge-io reelforge-text reelforge reelforge-cli; do
            if crate_exists "$c" "0.1.0"; then
              echo "OK $c 0.1.0"
            else
              echo "MISSING $c 0.1.0"
              exit 1
            fi
          done
