# Publish workspace crates to crates.io (ordered by dependency graph).
name: publish-crates

on:
  workflow_dispatch:

# crates.io rate-limits; publish one crate at a time with settle waits.
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CARGO_REGISTRY_TOKEN:-}" ]]; then
            echo "CARGO_REGISTRY_TOKEN secret is missing"
            exit 1
          fi

          wait_for_crate() {
            local name="$1"
            local ver="$2"
            echo "Waiting for ${name}@${ver} on crates.io index..."
            for i in $(seq 1 40); do
              if cargo search "$name" --limit 10 2>/dev/null | grep -E "^${name} = " | head -1 | grep -q "${ver}"; then
                echo "Found ${name} ${ver}"
                return 0
              fi
              # Fallback: sparse index can lag; also try curl
              if curl -fsS "https://crates.io/api/v1/crates/${name}/${ver}" >/dev/null 2>&1; then
                echo "API sees ${name} ${ver}"
                # still give the index a moment
                sleep 15
                return 0
              fi
              sleep 15
            done
            echo "Timed out waiting for ${name}@${ver}"
            return 1
          }

          publish_one() {
            local pkg="$1"
            echo "==== Publishing ${pkg} ===="
            cargo publish -p "${pkg}" --locked 2>&1 || {
              # Already published is OK on re-runs
              if cargo search "${pkg}" --limit 5 2>/dev/null | grep -q "^${pkg} = "; then
                echo "${pkg} already on crates.io; continuing"
                return 0
              fi
              return 1
            }
          }

          VER="0.1.0"

          publish_one reelforge-core
          wait_for_crate reelforge-core "$VER"

          publish_one reelforge-compose
          wait_for_crate reelforge-compose "$VER"

          publish_one reelforge-fx
          wait_for_crate reelforge-fx "$VER"

          publish_one reelforge-io
          wait_for_crate reelforge-io "$VER"

          publish_one reelforge-text
          wait_for_crate reelforge-text "$VER"

          publish_one reelforge
          wait_for_crate reelforge "$VER"

          publish_one reelforge-cli
          wait_for_crate reelforge-cli "$VER"

          echo "All crates published."
