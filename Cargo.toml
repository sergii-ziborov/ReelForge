[workspace]
members = [
    "crates/reelforge",
    "crates/reelforge-cli",
    "crates/reelforge-compose",
    "crates/reelforge-core",
    "crates/reelforge-fx",
    "crates/reelforge-io",
    "crates/reelforge-text",
]
resolver = "3"
default-members = ["crates/reelforge", "crates/reelforge-cli"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/sergii-ziborov/ReelForge"
homepage = "https://github.com/sergii-ziborov/ReelForge"
rust-version = "1.97"
authors = ["Sergii Ziborov"]
description = "Programmatic video composition and editing for Rust"
keywords = ["video", "audio", "editing", "composition", "ffmpeg"]
categories = ["multimedia", "multimedia::video", "multimedia::audio"]

[workspace.dependencies]
reelforge = { path = "crates/reelforge", version = "0.1.1" }
reelforge-cli = { path = "crates/reelforge-cli", version = "0.1.1" }
reelforge-compose = { path = "crates/reelforge-compose", version = "0.1.1" }
reelforge-core = { path = "crates/reelforge-core", version = "0.1.1" }
reelforge-fx = { path = "crates/reelforge-fx", version = "0.1.1" }
reelforge-io = { path = "crates/reelforge-io", version = "0.1.1" }
reelforge-text = { path = "crates/reelforge-text", version = "0.1.1" }
clap = { version = "4", features = ["derive"] }
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rayon = "1.10"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
